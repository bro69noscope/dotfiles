gui:
  mainPanelSplitMode: horizontal
  useHunkModeInStagingView: true
  skipRewordInEditorWarning: true
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#29a4bd"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#2e3c64"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
  scrollHeight: 4
  nerdFontsVersion: "3"
  border: "rounded"
git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --true-color=always
# useConfig: true

# os: # will figure it out eventually but rn it's commented out

#   editPreset: nvim-remote
keybinding:
  commits:
    moveDownCommit: "<a-j>"
    moveUpCommit: "<a-k>"

customCommands:
  # For files panel

  - key: "<c-a>"
    context: "files"
    description: "AI commit message"
    command: >
      (git log --oneline -30 && echo "---DIFF---" && git diff --staged) |
      claude -p "The lines above the ---DIFF--- marker are this repo's recent
      commit history. Match that exact style (type(scope): description) for the
      diff below the marker. Output ONLY the commit message, no preamble, no
      markdown fences." | git commit --edit -F -
    loadingText: "Asking Claude for a commit message..."
    output: terminal

  - key: "I"
    command: "git -c delta.features=side-by-side diff {{.SelectedPath}}"
    context: "files"
    description: "Delta diff of selected item"
    loadingText: "Opening diff in Delta..."
    output: terminal
  - key: "O"
    command: "git -c delta.features=side-by-side diff --cached -- {{.SelectedPath}}"
    context: "files"
    description: "Delta diff of staged changes"
    loadingText: "Opening staged diff..."
    output: terminal
  - key: "S"
    command: "git -c delta.features=side-by-side diff --cached"
    context: "files"
    description: "Delta diff of all staged changes"
    loadingText: "Opening staged diff..."
    output: terminal
  - key: "E"
    command: 'git commit --allow-empty -m "{{index .PromptResponses 0}}"'
    context: "files"
    prompts:
      - type: "input"
        title: "Commit message"

  # For commits panel

  - key: "I"
    command: "git -c delta.features=side-by-side show {{.SelectedCommit.Sha}} -p"
    context: "commits"
    description: "Show commit with Delta side-by-side"
    loadingText: "Opening commit diff in Delta..."
    output: terminal

  - key: "<c-y>"
    command: "git show {{.SelectedCommit.Sha}} | clip"
    context: "commits"
    description: "Copy commit diff to clipboard"
    loadingText: "Copying diff to clipboard..."
    output: log

  # For files within a commit or stash
  - key: "I"
    command: "git -c delta.features=side-by-side show {{.SelectedCommit.Sha}} -- {{.SelectedCommitFilePath}}"
    context: "commitFiles"
    description: "Show file in commit/stash with Delta side-by-side"
    loadingText: "Opening file diff in Delta..."
    output: terminal
  # For stash entries
  - key: "I"
    command: "git -c delta.features=side-by-side stash show -p {{.SelectedStashEntry.Index}}"
    context: "stash"
    description: "Show stash with Delta side-by-side"
    loadingText: "Opening stash in Delta..."
    output: terminal
  # For local branches
  - key: "I"
    command: "git -c delta.features=side-by-side diff {{.CheckedOutBranch.Name}}..{{.SelectedLocalBranch.Name}}"
    context: "localBranches"
    description: "Compare current branch with selected branch"
    loadingText: "Comparing branches with Delta..."
    output: terminal
  # For remote branches
  - key: "I"
    command: "git -c delta.features=side-by-side diff {{.CheckedOutBranch.Name}}..{{.SelectedRemoteBranch.RemoteName}}/{{.SelectedRemoteBranch.Name}}"
    context: "remoteBranches"
    description: "Compare current branch with selected remote branch"
    loadingText: "Comparing with remote branch..."
    output: terminal
  # For commits when viewing branch history (after pressing Enter on a branch)
  - key: "I"
    command: "git -c delta.features=side-by-side show {{.SelectedCommit.Sha}} -p"
    context: "subCommits"
    description: "Show commit with Delta side-by-side"
    loadingText: "Opening commit diff in Delta..."
    output: terminal
  # For tags
  - key: "I"
    command: "git -c delta.features=side-by-side show {{.SelectedTag.Name}} -p"
    context: "tags"
    description: "Show tag with Delta side-by-side"
    loadingText: "Opening tag diff in Delta..."
    output: terminal
