[terminal.shell]
program = "pwsh.exe"

[font.normal]
family = "BerkeleyMono Nerd Font"
style = "Regular"

[font]
# 1440p 175% win os scale
# size = 12.5

# 1080p 150% win os scale 145 nvim col
size = 11.6

[window]
dimensions = { columns = 100, lines = 30 }
# padding = { x = 10, y = 10 }
padding = { x = 180, y = 10 } # for claude code usage
dynamic_padding = true

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
]
